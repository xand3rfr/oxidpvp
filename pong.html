<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="scoreboard">
      <div class="side"><i class="sw" id="sw0"></i><span class="name" id="name0">Left</span><span class="num" id="s0">0</span></div>
      <span class="sep">:</span>
      <div class="side"><span class="num" id="s1">0</span><span class="name" id="name1">Right</span><i class="sw" id="sw1"></i></div>
    </div>
    <div class="net" id="net"><i class="dot"></i><span>offline</span></div>
  </header>
  <main class="stage"><canvas id="c"></canvas></main>
  <p class="hint"><kbd>Mouse</kbd> / <kbd>Touch</kbd> or <kbd>W</kbd><kbd>S</kbd> move paddle · edge hits angle the ball · first to 7</p>

  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle">Victory</div>
      <div class="final" id="resultScore">7 – 3</div>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="rematch">Rematch</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/net.js"></script>
  <script src="js/pong.js"></script>
</body>
</html>
