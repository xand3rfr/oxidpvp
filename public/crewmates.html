<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#07070a">
  <title>Crewmates · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Crewmates</div>
    <div class="net" id="side"></div>
  </header>
  <div class="cm-hud">
    <span class="cm-role" id="roleTag"></span>
    <div class="cm-bar"><span>Tasks</span><div class="cm-track"><i id="bar"></i></div></div>
  </div>
  <main class="stage cm-stage"><canvas id="c"></canvas>
    <ul class="cm-tasks" id="tasks"></ul>
    <div class="cm-actions">
      <button class="btn" id="reportBtn" type="button" disabled>📢 Report</button>
      <button class="btn danger" id="killBtn" type="button" hidden disabled>🔪 Kill</button>
      <button class="btn primary" id="useBtn" type="button" disabled>✋ Use</button>
    </div>
  </main>
  <p class="hint"><kbd>WASD</kbd> move · hold <kbd>E</kbd> use · <kbd>R</kbd> report · <kbd>Q</kbd> kill (impostor) · use the chat in meetings</p>
  <div class="overlay cm-meet" id="meeting" hidden>
    <div class="panel">
      <div class="big" id="meetTitle"></div>
      <p class="muted" id="meetSub"></p>
      <div class="cm-timer" id="meetTimer"></div>
      <div class="cm-votes" id="voteList"></div>
      <button class="btn ghost full" id="skipBtn" type="button">Skip vote</button>
    </div>
  </div>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/crewmates.js"></script>
</body>
</html>
