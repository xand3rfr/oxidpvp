<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OXIDPVP</title>
<script>
  // Lets casino.oxidpvp.net use the same saved data (wallet, name, level, friends) as the main
  // site. Only the casino subdomain may talk to it, and only oxidpvp-* keys are shared.
  (() => {
    const allowed = (origin) => {
      try {
        const u = new URL(origin);
        return u.protocol === location.protocol && u.port === location.port && u.hostname === "casino." + location.hostname;
      } catch { return false; }
    };
    addEventListener("message", (e) => {
      if (!allowed(e.origin) || !e.data || typeof e.data !== "object") return;
      const m = e.data;
      try {
        if (m.t === "get") {
          const all = {};
          for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("oxidpvp-")) all[k] = localStorage.getItem(k); }
          e.source.postMessage({ t: "all", all }, e.origin);
        } else if (m.t === "set" && typeof m.k === "string" && m.k.startsWith("oxidpvp-") && m.k.length < 80) {
          if (m.v == null) localStorage.removeItem(m.k); else localStorage.setItem(m.k, String(m.v).slice(0, 500000));
        }
      } catch {}
    });
    if (parent !== window) parent.postMessage({ t: "ready" }, "*");
  })();
</script>
