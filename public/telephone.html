<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <title>Telephone · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Telephone</div>
    <div class="net" id="side"></div>
  </header>
  <main class="play tp">
    <div class="tv-top ml-top"><span id="stepLabel"></span><span class="ml-timer" id="timer"></span></div>
    <section class="tp-play" id="play">
      <h2 class="tp-task" id="task"></h2>
      <div class="tp-prompt" id="prompt" hidden></div>
      <div class="tp-see" id="seeWrap" hidden><canvas id="see"></canvas></div>
      <div class="tp-padwrap" id="padWrap" hidden>
        <canvas id="pad"></canvas>
        <div class="tp-tools">
          <div class="tp-colors" id="colors"></div>
          <div class="tp-sizes" id="sizes"></div>
          <button class="btn" id="undo" type="button">Undo</button>
          <button class="btn ghost" id="clear" type="button">Clear</button>
        </div>
      </div>
      <button class="btn primary lg" id="doneBtn" type="button" hidden>Done drawing</button>
      <form class="wl-form" id="textForm" autocomplete="off" hidden>
        <input id="textIn" maxlength="80" aria-label="Your text">
        <button class="btn primary" type="submit">Submit</button>
      </form>
    </section>
    <section class="tp-show" id="show" hidden>
      <h2 class="tp-task" id="showLabel"></h2>
      <div class="tp-chain" id="chain"></div>
      <button class="btn primary lg" id="nextBtn" type="button" hidden>Next</button>
      <div class="row" id="againRow" hidden><button class="btn primary lg" id="again2" type="button">Play again</button></div>
    </section>
    <p class="tv-msg" id="status"></p>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/telephone.js"></script>
</body>
</html>
