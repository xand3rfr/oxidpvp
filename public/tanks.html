<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tank Duel · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="scoreboard">
      <div class="side"><i class="sw" id="sw0"></i><span class="name" id="name0">You</span><span class="num" id="s0">0</span></div>
      <span class="sep">:</span>
      <div class="side"><span class="num" id="s1">0</span><span class="name" id="name1">Opponent</span><i class="sw" id="sw1"></i></div>
    </div>
    <div class="net" id="net"><i class="dot"></i><span>offline</span></div>
  </header>
  <main class="stage"><canvas id="c"></canvas></main>
  <p class="hint"><kbd>WASD</kbd> move · <kbd>Mouse</kbd> aim · <kbd>Click</kbd> shoot · <kbd>Space</kbd> boost · shells bounce twice · first to 5</p>

  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle">Victory</div>
      <div class="final" id="resultScore">5 – 3</div>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="rematch">Rematch</button>
      </div>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/tanks.js"></script>
</body>
</html>
