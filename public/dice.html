<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";var a=t.accent;if(!t.b&&a==="violet")a="pink";if(a&&a!=="pink")d.dataset.accent=a}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#000000">
  <title>Liar's Dice · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Liar's Dice</div>
    <div class="net" id="side"></div>
  </header>
  <main class="play ld">
    <div class="ld-table" id="table"></div>
    <section class="ld-center">
      <div class="ld-current" id="current"></div>
      <p class="ld-log" id="log"></p>
      <p class="ld-total muted" id="totalDice"></p>
    </section>
    <section class="ld-me">
      <div class="ld-label"><span>Your dice</span><span class="ld-timer" id="timer"></span></div>
      <div class="ld-mine" id="mine"></div>
      <div class="ld-controls" id="controls" hidden>
        <div class="ld-row">
          <div class="stepper">
            <button class="btn" id="qMinus" type="button" aria-label="Fewer">−</button>
            <span id="qVal">1</span>
            <button class="btn" id="qPlus" type="button" aria-label="More">+</button>
          </div>
          <div class="ld-faces" id="faces"></div>
        </div>
        <div class="ld-row">
          <button class="btn primary" id="bidBtn" type="button">Bid</button>
          <button class="btn liar" id="liarBtn" type="button">Liar!</button>
        </div>
      </div>
      <p class="ld-waiting muted" id="waiting" hidden></p>
    </section>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/dice.js"></script>
</body>
</html>
