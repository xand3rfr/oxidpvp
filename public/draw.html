<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#07070a">
  <title>Draw &amp; Guess · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Draw &amp; Guess</div>
    <div class="net" id="side"></div>
  </header>
  <main class="dg">
    <section class="dg-main">
      <div class="dg-top">
        <span class="dg-round" id="round"></span>
        <div class="dg-word" id="word"></div>
        <span class="dg-time" id="time"></span>
      </div>
      <div class="dg-canvas">
        <div class="dg-frame">
          <canvas id="board" width="800" height="600"></canvas>
          <div class="dg-cover" id="cover" hidden></div>
        </div>
      </div>
      <div class="dg-tools" id="tools" hidden>
        <div class="dg-colors" id="colors"></div>
        <div class="dg-sizes" id="sizes"></div>
        <button class="btn" id="undo" type="button">Undo</button>
        <button class="btn ghost" id="clear" type="button">Clear</button>
      </div>
    </section>
    <aside class="dg-side">
      <ol class="dg-players" id="players"></ol>
      <div class="dg-feed" id="feed" aria-live="polite"></div>
      <form class="dg-guess" id="guessForm" autocomplete="off">
        <input id="guess" placeholder="Type your guess…" maxlength="40" aria-label="Your guess">
        <button class="btn primary" type="submit">Guess</button>
      </form>
    </aside>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/draw-words.js"></script>
  <script src="js/draw.js"></script>
</body>
</html>
