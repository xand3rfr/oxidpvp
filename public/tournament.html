<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <title>Tournament · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Tournament</div>
    <div class="net" id="side"></div>
  </header>
  <main class="play cup-page">
    <div class="tv-top ml-top"><span>Tournament · <b id="gameName"></b></span></div>
    <div class="cup-mine" id="mine" hidden>
      <strong id="mineTitle"></strong>
      <a class="btn primary lg" id="play" target="_blank" rel="opener">Play your match ↗</a>
      <div class="row"><button class="btn ghost sm" id="iwon" type="button">I won</button><button class="btn ghost sm" id="ilost" type="button">I lost</button></div>
    </div>
    <div class="cup-bracket" id="bracket"></div>
    <p class="tv-msg" id="status"></p>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/tournament.js"></script>
</body>
</html>
