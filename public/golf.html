<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <title>Mini Golf · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="scoreboard">
      <div class="side"><i class="sw" id="sw0"></i><span class="name" id="name0">You</span><span class="num" id="s0">0</span></div>
      <span class="sep">:</span>
      <div class="side"><span class="num" id="s1">0</span><span class="name" id="name1">Opponent</span><i class="sw" id="sw1"></i></div>
    </div>
    <div class="net" id="net"><i class="dot"></i><span>offline</span></div>
  </header>
  <div class="gf-top"><span id="hud">Mini Golf</span></div>
  <main class="stage"><canvas id="c"></canvas></main>
  <div class="gf-wrap"><table class="gf-card" id="card"></table></div>
  <p class="hint"><kbd>Drag back</kbd> from anywhere and let go to putt · fewest strokes wins</p>

  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle">You win</div>
      <div class="final" id="resultScore"></div>
      <div class="row">
        <button class="btn ghost" id="peek" type="button">See board</button>
        <button class="btn primary" id="rematch" type="button">Rematch</button>
      </div>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/golf.js"></script>
</body>
</html>
