<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";var a=t.accent;if(!t.b&&a==="violet")a="pink";if(a&&a!=="pink")d.dataset.accent=a}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#000000">
  <title>Leaderboard · OXIDPVP</title>
  <meta name="description" content="Top players on OXIDPVP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-in">
      <a class="brand" href="index.html"><i class="brand-mark"></i><span>OXID<b>PVP</b></span></a>
      <div class="nav-links">
        <a href="index.html#games">Games</a>
        <a href="rooms.html">Public rooms</a>
        <a href="leaderboard.html" aria-current="page">Leaderboard</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="changelog.html" id="navChangelog">Changelog</a>
      </div>
      <div class="nav-right">
        <a class="btn primary" href="index.html#games">Play now</a>
      </div>
    </div>
  </nav>

  <div class="hub">
    <div class="wrap page">
      <div class="page-head">
        <div>
          <h1>Leaderboard</h1>
          <p class="muted">Wins from real games with at least two people. Pick a name in any lobby to show up here.</p>
        </div>
        <select id="game" aria-label="Game"><option value="all">All games</option></select>
      </div>
      <div class="lb">
        <div class="lb-row lb-head" id="head"><span>#</span><span>Player</span><span>W</span><span>L</span><span>D</span><span>Win %</span></div>
        <div id="rows"></div>
      </div>
      <div class="empty" id="empty" hidden>
        <div class="empty-ico">🏆</div>
        <h2>No results yet</h2>
        <p class="muted">Win a game to claim the top spot.</p>
      </div>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script>
    (() => {
      const sel = document.getElementById("game"), rowsEl = document.getElementById("rows"), empty = document.getElementById("empty");
      // Special boards with their own columns.
      const SPECIAL = {
        ranked: { label: "⚔️ Ranked · 1v1 rating", url: "/api/ranked", cols: ["#", "Player", "Rating", "W", "L"], row: (r) => [r.name, r.rating, r.w, r.l] },
      };
      for (const [k, b] of Object.entries(SPECIAL)) sel.append(new Option(b.label, k));
      for (const g of GameUtil.games) sel.append(new Option(g.title, g.id));
      const want = new URLSearchParams(location.search).get("game");
      if (want && (GameUtil.gameById(want) || SPECIAL[want])) sel.value = want;
      const head = document.getElementById("head"), headHTML = head.innerHTML;
      const me = (localStorage.getItem("oxidpvp-name") || "").toLowerCase();
      async function load() {
        rowsEl.textContent = "";
        let data = { rows: [] };
        const sp = SPECIAL[sel.value];
        try { data = await (await fetch(sp ? sp.url : "/api/leaderboard?game=" + sel.value, { cache: "no-store" })).json(); } catch {}
        empty.hidden = data.rows.length > 0;
        head.className = "lb-row lb-head" + (sp ? " lb-" + sp.cols.length : "");
        if (sp) { head.textContent = ""; for (const c of sp.cols) { const x = document.createElement("span"); x.textContent = c; head.append(x); } }
        else head.innerHTML = headHTML;
        if (sp) {
          data.rows.forEach((r, i) => {
            const row = document.createElement("div");
            row.className = "lb-row lb-" + sp.cols.length + (i < 3 ? " top t" + i : "") + (r.name.toLowerCase() === me ? " me" : "");
            for (const v of [i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1, ...sp.row(r)]) { const c = document.createElement("span"); c.textContent = v; row.append(c); }
            rowsEl.append(row);
          });
          return;
        }
        data.rows.forEach((r, i) => {
          const row = document.createElement("div");
          row.className = "lb-row" + (i < 3 ? " top t" + i : "") + (r.name.toLowerCase() === me ? " me" : "");
          const total = r.w + r.l + r.d;
          for (const v of [i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1, r.name, r.w, r.l, r.d, total ? Math.round((r.w / total) * 100) + "%" : "–"]) {
            const c = document.createElement("span"); c.textContent = v; row.append(c);
          }
          rowsEl.append(row);
        });
      }
      sel.addEventListener("change", () => { history.replaceState(null, "", "?game=" + sel.value); load(); });
      load();
    })();
  </script>
</body>
</html>
