<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{var t=JSON.parse(localStorage.getItem("oxidpvp-theme")||"{}"),d=document.documentElement;if(t.mode==="light")d.dataset.theme="light";if(t.accent&&t.accent!=="violet")d.dataset.accent=t.accent}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#07070a">
  <title>Wavelength · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Wavelength</div>
    <div class="net" id="side"></div>
  </header>
  <main class="play wl">
    <div class="tv-top ml-top"><span id="round"></span><span class="ml-timer" id="timer"></span></div>
    <h2 class="ml-prompt wl-clue" id="clue"></h2>
    <div class="wl-dial">
      <div class="wl-ends"><span id="left"></span><span id="right"></span></div>
      <div class="wl-track" id="track">
        <div class="wl-thumb" id="thumb" hidden></div>
        <input type="range" id="dial" min="0" max="100" value="50" aria-label="Your guess">
      </div>
    </div>
    <button class="btn primary lg" id="lock" type="button" hidden>Lock in guess</button>
    <form class="wl-form" id="clueForm" autocomplete="off" hidden>
      <input id="clueIn" maxlength="60" placeholder="Type your clue…" aria-label="Your clue">
      <button class="btn primary" type="submit">Give clue</button>
    </form>
    <p class="tv-msg" id="status"></p>
    <div class="tv-board" id="board"></div>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/wavelength.js"></script>
</body>
</html>
