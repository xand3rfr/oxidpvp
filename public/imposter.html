<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <title>Imposter · OXIDPVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body class="game-page">
  <header class="topbar">
    <a class="back" href="index.html">&larr; <span>Games</span></a>
    <div class="tb-title">Imposter</div>
    <div class="net" id="side"></div>
  </header>
  <main class="play im">
    <div class="tv-top ml-top"><span id="round"></span><span class="ml-timer" id="timer"></span></div>
    <div class="im-card" id="card">
      <span class="im-cat">Category: <b id="cat"></b></span>
      <span class="im-hint" id="cardHint"></span>
      <strong class="im-word" id="word"></strong>
    </div>
    <div class="im-list" id="clues"></div>
    <form class="wl-form" id="clueForm" autocomplete="off" hidden>
      <input id="clueIn" maxlength="20" placeholder="One word…" aria-label="Your clue">
      <button class="btn primary" type="submit">Say it</button>
    </form>
    <div class="im-guess" id="guessBox" hidden><div class="im-opts" id="guessOpts"></div></div>
    <p class="tv-msg" id="status"></p>
    <div class="tv-board" id="board"></div>
  </main>
  <div class="overlay" id="result" hidden>
    <div class="panel result">
      <div class="big" id="resultTitle"></div>
      <ul class="standings" id="standings"></ul>
      <div class="row">
        <a class="btn ghost" href="index.html">Leave</a>
        <button class="btn primary" id="again">Play again</button>
      </div>
      <p class="muted" id="againWait" style="font-size:13px;margin-top:12px" hidden>Waiting for the host to start another game…</p>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/party.js"></script>
  <script src="js/imposter.js"></script>
</body>
</html>
